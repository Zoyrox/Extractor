# Ping settimanale a Supabase per evitare la pausa per inattività del piano
# gratuito. Richiede due secret del repository (Settings → Secrets and
# variables → Actions): SUPABASE_URL e SUPABASE_ANON_KEY.
name: Keepalive Supabase

on:
  schedule:
    - cron: '17 6 * * 1'   # ogni lunedì alle 06:17 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chiama la RPC keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secret SUPABASE_URL / SUPABASE_ANON_KEY non impostati: salto."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
